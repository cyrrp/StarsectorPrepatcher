# StarsectorPrepatcher 0.18.1
# Conservative profile: only patches with near-exact behavior and no TTL/visual LOD.
# Copy this file over ../prepatcher.properties, then restart Starsector.
enabled=true
patch.mapRenderStuff=true
patch.mapHitTest=false
patch.labelSpatialCandidates=false
patch.intelCallbackCache=false
patch.intelArrowRendering=false
patch.intelReconciliation=true
patch.intelEntityIndex=false
# Campaign-thread owner-cache maintenance remains configured even when the
# corresponding optional UI indexes are disabled in this profile.
cache.maintenanceIntervalMs=30000
hover.ownerIdleTtlMs=300000
hover.cellPruneIntervalMs=30000
label.ownerIdleTtlMs=600000
intel.entityIndexOwnerIdleTtlMs=600000
patch.systemNebulaCache=false
patch.sampleCacheClearThrottle=false
patch.gridLineCap=false
patch.campaignListenerThrottle=true
campaign.listenerAuditMs=1000
patch.campaignSnapshotReuse=true
patch.entityScriptSnapshotReuse=true
patch.emptyMemoryAdvanceFastPath=true

# Conservative cadence for the three-class incremental core-worlds index. Initial/recovery
# reconciliation materializes one full system snapshot; every simulation substep then scans only
# current core systems, while each outer frame audits a bounded slice for direct getTags() edits.
# Public topology/tag mutations are event-driven and memory-vector integrity remains immediate.
patch.coreWorldsExtentCache=true
coreWorlds.skipFastForwardIterations=false
coreWorlds.checkMemoryExpiry=true
coreWorlds.validationFrames=1
coreWorlds.auditSystemsPerFrame=64
patch.routeJumpPointIndex=false

# Defers StrategicModule hostile-market scans until a jump point has a destination
# accepted by the original exact-target/hyperspace-fallback predicate. The score is
# still computed at most once per accepted jump point and all candidate ordering is preserved.
patch.strategicJumpDestinationFirst=false
patch.strategicJumpDestinationIndex=false
# Economy index and persistent snapshot optimizations remain disabled in the conservative profile.
patch.economyLocationCache=false
# Full market cadence is preserved in the conservative profile.
patch.marketScheduler=false
# Keep vanilla/AoTD detached-Cargo global-step behavior in the conservative profile.
patch.campaignCargoNoGlobalEconomyStep=false
patch.lootTransferNoGlobalEconomyStep=false
patch.planetConditionMarketOpenNoGlobalEconomyStep=false
patch.vanillaMarketOpenLocalization=false
patch.uiMarketMutationRefresh=false
patch.commandTabNoGlobalEconomyStep=false
patch.commodityDetailNoGlobalEconomyStep=false
patch.marketDefensesNoGlobalEconomyStep=false

# Owner-local copy-on-write snapshots survive unchanged frames. Transformed Economy/Market
# mutators invalidate immediately; direct edits to live lists are detected by bounded audits.
# Avoid hidden global CommodityMarketData construction from Local Resources.
patch.localResourcesNoColdMarketData=false
patch.localResourcesTooltipSnapshot=false
# Owner-local ordered index for ReachEconomy.getMarketsInGroup().
patch.economyGroupIndex=false
patch.economyPersistentSnapshots=false
economy.structureAuditMs=5000
market.structureAuditFrames=600
# The private-key zero-path cache is opt-in outside the conservative profile.
patch.commodityEventModDirtyCache=false
# The whole-loop commodity active set is intentionally disabled in conservative mode.
patch.commodityTemporalFastPath=false
commodity.temporalAuditFrames=300

# Expiry-aware scheduling changes live timeRemaining materialization and is disabled in safe mode.
patch.tempModExpiryScheduler=false

# Aggressive direct BaseIndustry fast path. A full inherited advance() proves an industry dormant;
# subsequent empty callbacks are skipped until building/disruption state changes or the bounded
# audit expires. Custom advance()/isDisrupted()/getDisruptedKey() implementations stay vanilla.
# Market-condition callbacks are deliberately not classified because the helper costs more than
# an empty virtual call. Direct disruption-memory edits may be observed only at the next audit.
patch.marketNoOpCallbacks=false
market.noOpIndustryAuditFrames=600
patch.commRelaySystemIndex=false
commRelay.indexTtlMs=250
patch.shipAdvanceScratch=true
patch.particleCleanup=true
# KNOWN DISABLED in 0.7.1 after confirmed mission-startup failures; pending isolated fixes.
patch.loadingTextReader=false
patch.startupLogAggregation=false
patch.rulesLiteralParser=true
patch.saveLoadProgressThrottle=false
saveLoad.progressHz=0
patch.saveOutputBufferDedup=true
patch.hyperspaceViewportBounds=true
patch.skipNoOpTerrainLayer=true
patch.terrainRandomReuse=true
patch.automatonBufferReuse=true
patch.starfieldCleanupBuffers=true
patch.starfieldLinearRemoval=true
starfield.removeAllThreshold=8
starfield.pool.maxRetainedCapacity=32768
starfield.pool.oversizedGraceMs=300000

# Delayed high-water trimming for reusable campaign-thread scratch storage.
scratch.trim.enabled=true
scratch.trimGraceMs=300000
scratch.trim.maxListCapacity=32768
scratch.trim.maxIdentityEntries=32768
scratch.trim.maxSetEntries=32768
scratch.trim.maxPooledCollections=32

# Structurally matched fast-forward presentation coalescing; safe groups only.
patch.fastForwardPresentation=true
patch.fastForwardFrameMarker=true
patch.fastForwardActionIndicators=true
patch.fastForwardLocationVisuals=true
patch.fastForwardFloatingText=true
patch.fastForwardFleetView=true
patch.fastForwardFleetPresentation=true
patch.fastForwardSensorIndicators=true
patch.fastForwardCelestialVisuals=true
patch.fastForwardAuroraAnimation=true
patch.fastForwardContinuousSound=true
patch.fastForwardGateJitter=true
patch.fastForwardGlobalAnimations=false
patch.fastForwardSensorFaders=false
patch.fastForwardSlipstreamParticles=false
patch.fastForwardParticleEmitters=false
fastForward.visualTime=realtime

# Exact deferred-step history for the market scheduler.
market.remote.constructionAuditBatches=180
market.remote.maxPendingRuns=32
market.remote.exactReplayBeforeSave=false

# Exact economy-restore completion signal for the owned AoTD scheduler fork.
patch.aotdEconomyRestoreCoordination=true
# Clean BaseIndustry wrapper; AoTD semantics activate only after native handshake.
patch.aotdCleanDeficitPath=true

# Linear market-share aggregation replaces repeated full economy scans with one local pass.
# The related put-elision avoids a redundant LinkedHashMap.put on already materialized entries.
# Punitive expedition callers keep a method-local identity cache only; no campaign objects are
# retained after getExpeditionReasons() returns. Vanilla and Nexerelin callers are
# independently switchable; both are enabled by default.
patch.marketShareLinearAggregation=true
patch.marketShareDataPutElision=true
patch.punitivePlayerShareLocalCache=true
patch.nexPunitivePlayerShareLocalCache=true
