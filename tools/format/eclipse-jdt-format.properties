# Eclipse JDT formatter profile — compact 2-space style for StarsectorPrepatcher.
# Consumed by JdtFormat (tools/format) via org.eclipse.jdt.core.formatter.* keys.
# Only non-default settings are listed, except the pinned design targets marked
# "(pin)". Values verified against org.eclipse.jdt.core 3.41.0 defaults.
# NOTE: java.util.Properties keeps trailing "#" text inside values, so every
# explanation sits on its own comment line above the setting it describes.

# --- Indentation -------------------------------------------------------------
# spaces, not tabs (was tab)
org.eclipse.jdt.core.formatter.tabulation.char=space
# 2-space indent unit (was 4)
org.eclipse.jdt.core.formatter.tabulation.size=2
# matches tabulation.size (was 4)
org.eclipse.jdt.core.formatter.indentation.size=2
# (pin, default) 2 units = 4 spaces; keeps wrapped lines distinct from block bodies
org.eclipse.jdt.core.formatter.continuation_indentation=2
# (pin, default) same continuation width inside array literals
org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=2

# --- Line width --------------------------------------------------------------
# (pin, default) column limit; 100 costs +34.7k chars on this tree, 140 saves only 0.7%
org.eclipse.jdt.core.formatter.lineSplit=120

# --- Wrapping: pack, never explode -------------------------------------------
# Mask values: 16 = compact (wrap only over the limit, pack fragments),
# 48 = one-per-line, 64 = next-shifted, 80 = next-per-line, 0 = leave as written.
# (was 0) lets `x = "long literal"` break at = instead of overflowing column 120
org.eclipse.jdt.core.formatter.alignment_for_assignment=16
# (was 48) ternaries pack instead of one-per-line
org.eclipse.jdt.core.formatter.alignment_for_conditional_expression=16
# (was 80) try(...) resources pack instead of one-per-line
org.eclipse.jdt.core.formatter.alignment_for_resources_in_try=16
# (was 64) `extends` packs onto the header line
org.eclipse.jdt.core.formatter.alignment_for_superclass_in_type_declaration=16
# (was 64) `implements` packs onto the header line
org.eclipse.jdt.core.formatter.alignment_for_superinterfaces_in_type_declaration=16
# (was 64) same for enums
org.eclipse.jdt.core.formatter.alignment_for_superinterfaces_in_enum_declaration=16
# (was 64) same for records
org.eclipse.jdt.core.formatter.alignment_for_superinterfaces_in_record_declaration=16
# (was 52) when a kept-one-line if must wrap, wrap compactly not one-per-line
org.eclipse.jdt.core.formatter.alignment_for_compact_if=16
# (was 52) same for one-line loops
org.eclipse.jdt.core.formatter.alignment_for_compact_loops=16

# --- One-line constructs -----------------------------------------------------
# (sic: JDT's real key lacks the 's') keeps `if (x) a(); else b();` on one line
org.eclipse.jdt.core.formatter.keep_imple_if_on_one_line=true
# keeps `if (!enabled) return;` guard clauses on one line
org.eclipse.jdt.core.formatter.keep_then_statement_on_same_line=true
# keeps `else return;` on the else line
org.eclipse.jdt.core.formatter.keep_else_statement_on_same_line=true
# keeps `for (...) x();` on one line
org.eclipse.jdt.core.formatter.keep_simple_for_body_on_same_line=true
# keeps `while (...) x();` on one line
org.eclipse.jdt.core.formatter.keep_simple_while_body_on_same_line=true
# keeps `do x(); while (...);` compact
org.eclipse.jdt.core.formatter.keep_simple_do_while_body_on_same_line=true
# collapses `if (x) { return; }` guards to one line (braces kept)
org.eclipse.jdt.core.formatter.format_guardian_clause_on_one_line=true
# collapses `T get() { return t; }` to one line
org.eclipse.jdt.core.formatter.keep_simple_getter_setter_on_one_line=true
# `void m() {}` stays inline
org.eclipse.jdt.core.formatter.keep_method_body_on_one_line=one_line_if_empty
# empty blocks stay `{}`
org.eclipse.jdt.core.formatter.keep_code_block_on_one_line=one_line_if_empty
# `while (x) {}` stays inline
org.eclipse.jdt.core.formatter.keep_loop_body_block_on_one_line=one_line_if_empty
# `if (x) {}` stays inline
org.eclipse.jdt.core.formatter.keep_if_then_body_block_on_one_line=one_line_if_empty
# `new T() {}` stays inline
org.eclipse.jdt.core.formatter.keep_anonymous_type_declaration_on_one_line=one_line_if_empty
# `() -> {}` stays inline
org.eclipse.jdt.core.formatter.keep_lambda_body_block_on_one_line=one_line_if_empty
# `class C {}` stays inline
org.eclipse.jdt.core.formatter.keep_type_declaration_on_one_line=one_line_if_empty
# `switch (x) {}` stays inline
org.eclipse.jdt.core.formatter.keep_switch_body_block_on_one_line=one_line_if_empty
# `new int[] {}` stays inline
org.eclipse.jdt.core.formatter.keep_empty_array_initializer_on_one_line=true

# --- Leave comments and vertical whitespace alone ----------------------------
# Javadoc text untouched (was true)
org.eclipse.jdt.core.formatter.comment.format_javadoc_comments=false
# block comments untouched (was true)
org.eclipse.jdt.core.formatter.comment.format_block_comments=false
# line comments untouched (was true)
org.eclipse.jdt.core.formatter.comment.format_line_comments=false
# keep the double blank lines that exist today (was 1)
org.eclipse.jdt.core.formatter.number_of_empty_lines_to_preserve=2
# preserve """-block interiors; reindenting them changes the compiled string (was 0)
org.eclipse.jdt.core.formatter.text_block_indentation=3
